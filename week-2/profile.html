<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Healthcare Patient Portal - Profile</title>

    <link rel="stylesheet" href="css/profile.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">

        🏥 Healthcare Patient Portal

    </div>

    <div class="header-right">

        <button class="notification-btn">🔔</button>

        <button id="logoutBtn">Logout</button>

    </div>

</header>

<!-- ================= MAIN ================= -->

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>Dashboard</h2>

        <ul>

    <li onclick="window.location.href='dashboard.html'">
        🏠 Home
    </li>

    <li class="active">
        👤 Profile
    </li>

    <li onclick="window.location.href='appointment.html'">
        📅 Book Appointment
    </li>

    <li onclick="window.location.href='myappointments.html'">
        📋 My Appointments
    </li>

    <li onclick="window.location.href='medicalrecords.html'">📄 Medical Records</li>

    <li onclick="window.location.href='prescriptions.html'">💊 Prescriptions</li>

    <li onclick="window.location.href='reports.html'">📊 Reports</li>

    <li onclick="window.location.href='settings.html'">⚙️ Settings</li>

</ul>

    </aside>

    <!-- Content -->

    <main class="content">

        <div class="profile-card">

            <h1>My Profile</h1>

            <p class="subtitle">

                View and update your personal information.

            </p>

            <!-- Profile Image -->

            <div class="profile-image">

                <img src="images/profile.jpg" alt="Profile">

            </div>

            <!-- Form -->

            <form id="profileForm">

                <div class="row">

                    <div class="input-group">

                        <label>👤 Full Name</label>

                        <input
                            type="text"
                            id="name"
                        >

                    </div>

                    <div class="input-group">

                        <label>📧 Email</label>

                        <input
                            type="email"
                            id="email"
                            readonly
                        >

                    </div>

                </div>

                <div class="row">

                    <div class="input-group">

                        <label>📞 Phone Number</label>

                        <input
                            type="text"
                            id="phone"
                        >

                    </div>

                    <div class="input-group">

                        <label>🎂 Age</label>

                        <input
                            type="number"
                            id="age"
                        >

                    </div>

                </div>

                <div class="row">

                    <div class="input-group">

                        <label>⚧ Gender</label>

                        <select id="gender">

                            <option>Male</option>

                            <option>Female</option>

                            <option>Other</option>

                        </select>

                    </div>

                    <div class="input-group">

                        <label>🩸 Blood Group</label>

                        <select id="blood">

                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>

                        </select>

                    </div>

                </div>

                <button type="submit">

                    💾 Save Changes

                </button>

            </form>

        </div>

    </main>

</div>

<script src="js/profile.js"></script>

</body>

</html>
