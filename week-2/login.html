<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Healthcare Patient Portal - Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="container">

        <!-- Left Side -->
        <div class="left">

            <img src="images/hospital.jpg" alt="Hospital">

            <h1>Healthcare Patient Portal</h1>

            <p>
                Your health, our priority.
                Securely access your medical records,
                appointments, and healthcare services.
            </p>

        </div>

        <!-- Right Side -->
        <div class="right">

            <div class="login-box">

                <h2>Welcome Back</h2>

                <p class="subtitle">
                    Login to continue
                </p>

                <form id="loginForm">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit">
                        Login
                    </button>

                </form>

                <p class="register">

                    Don't have an account?

                    <a href="register.html">
                        Register
                    </a>

                </p>

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
