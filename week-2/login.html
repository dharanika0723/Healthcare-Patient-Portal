<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Patient Portal - Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #2563eb
            );
        }

        .container{

            width:430px;

            background:#1e40af;

            padding:40px;

            border-radius:22px;

            box-shadow:0 15px 35px rgba(0,0,0,0.35);

            text-align:center;
        }

        .logo{

            margin-bottom:25px;
        }

        .logo-icon{

            font-size:55px;

            margin-bottom:10px;
        }

        .logo h1{

            color:white;

            font-size:28px;

            font-weight:bold;
        }

        h2{

            color:white;

            margin-top:25px;

            margin-bottom:30px;
        }

        input{

            width:100%;

            padding:14px;

            margin:12px 0;

            border:none;

            border-radius:12px;

            background:white;

            font-size:16px;

            outline:none;
        }

        button{

            width:100%;

            padding:14px;

            margin-top:15px;

            border:none;

            border-radius:12px;

            background:#0f172a;

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            background:#020617;

            transform:translateY(-2px);
        }

        .links{

            margin-top:18px;
        }

        .links a{

            color:white;

            text-decoration:none;

            font-size:14px;
        }

        p{

            color:white;

            margin-top:18px;
        }

        p a{

            color:#bfdbfe;

            text-decoration:none;

            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">

        <div class="logo-icon">
            🏥
        </div>

        <h1>Healthcare Patient Portal</h1>

    </div>

    <h2>Welcome Back</h2>

    <form onsubmit="return validateForm()">

        <input
            type="email"
            id="email"
            placeholder="Enter Email">

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <button type="submit">

            Login

        </button>

    </form>

    <div class="links">

        <a href="#">
            Forgot Password?
        </a>

    </div>

    <p>

        Don't have an account?

        <a href="register.html">
            Sign Up
        </a>

    </p>

</div>

<script>

function validateForm(){

    let email = document.getElementById("email").value.trim();

    let password = document.getElementById("password").value.trim();


    // Check empty email

    if(email === ""){

        alert("Email cannot be empty");

        return false;
    }


    // Check valid email format

    if(!email.includes("@")){

        alert("Please enter a valid email");

        return false;
    }


    // Check empty password

    if(password === ""){

        alert("Password cannot be empty");

        return false;
    }


    // Password length check

    if(password.length < 6){

        alert("Password must contain at least 6 characters");

        return false;
    }


    alert("Login Successful!");

    return true;
}

</script>

</body>
</html>
