<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Healthcare Patient Portal - Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    position:relative;

    background:linear-gradient(
    135deg,
    #0f172a,
    #1e3a8a,
    #2563eb
    );
}

/* Background Circles */

body::before{

    content:"";

    position:absolute;

    width:320px;

    height:320px;

    border-radius:50%;

    background:rgba(255,255,255,0.08);

    top:-100px;

    left:-80px;
}

body::after{

    content:"";

    position:absolute;

    width:260px;

    height:260px;

    border-radius:50%;

    background:rgba(255,255,255,0.06);

    bottom:-80px;

    right:-70px;
}


/* Wave */

.wave{

    position:absolute;

    bottom:0;

    left:0;

    width:100%;

    height:170px;

    background:rgba(255,255,255,0.08);

    border-radius:100% 100% 0 0;
}



/* Register Card */

.container{

    width:450px;

    background:#1e40af;

    padding:35px;

    border-radius:22px;

    text-align:center;

    box-shadow:0 15px 35px rgba(0,0,0,0.35);

    z-index:1;
}



.logo-icon{

    font-size:55px;

    margin-bottom:10px;
}

.logo h1{

    color:white;

    font-size:28px;

    margin-bottom:25px;
}


h2{

    color:white;

    margin-bottom:25px;
}


input{

    width:100%;

    padding:14px;

    margin:10px 0;

    border:none;

    border-radius:12px;

    font-size:16px;

    outline:none;
}



button{

    width:100%;

    padding:14px;

    margin-top:15px;

    border:none;

    border-radius:12px;

    background:#0f172a;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    background:#020617;

    transform:translateY(-2px);
}


p{

    color:white;

    margin-top:18px;
}

p a{

    color:#bfdbfe;

    text-decoration:none;

    font-weight:bold;
}

</style>

</head>

<body>


<div class="wave"></div>


<div class="container">

<div class="logo">

<div class="logo-icon">

🏥

</div>

<h1>Healthcare Patient Portal</h1>

</div>


<h2>Create Account</h2>


<form onsubmit="return validateForm()">

<input type="text"
id="name"
placeholder="Full Name">


<input type="email"
id="email"
placeholder="Email Address">


<input type="text"
id="phone"
placeholder="Phone Number">


<input type="password"
id="password"
placeholder="Password">


<input type="password"
id="confirmPassword"
placeholder="Confirm Password">


<button type="submit">

Register

</button>

</form>


<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>



<script>

function validateForm(){

let name=document.getElementById("name").value;

let email=document.getElementById("email").value;

let phone=document.getElementById("phone").value;

let password=document.getElementById("password").value;

let confirmPassword=document.getElementById("confirmPassword").value;


if(name==""){

alert("Please enter your name");

return false;
}


if(email==""){

alert("Please enter your email");

return false;
}


if(phone==""){

alert("Please enter your phone number");

return false;
}


if(password==""){

alert("Please enter your password");

return false;
}


if(confirmPassword==""){

alert("Please confirm your password");

return false;
}


if(password!==confirmPassword){

alert("Passwords do not match");

return false;
}


alert("Registration Successful!");

return true;

}

</script>

</body>
</html>
